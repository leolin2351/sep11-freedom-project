<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="style.css" rel="stylesheet" type="text/css" />
        <style>
            /* CSS */
            .bg {
                background: whitesmoke; 
                align-items: center;
            }
            .bg-border1 {
                border: 4px solid black;
                margin-bottom: 10px;
                margin-right: 20px;
                padding: 10px;
                margin-left: 20px;
            }
            .questions {
                 align-items: center; 
            }
            input[type="radio"] {
                transform: scale(1.5);
                margin: 30px;
            }
            .age-choice{
                display:block;
                font-size: 30px;
                border: 4px solid black;
                margin-bottom: 10px;
                margin-right: 20px;
                margin-left: 20px;
            }
            .age-option{
                transform: scale(2);
                margin: 30px;
            }
            button{
                transform: scale(1.5);
                margin: 30px;
            }
        </style>

            <title>MainHub</title>
            </head>
            <body class="bg">
            <!-- MainHub -->
            <div class = "bg-border1">
                <h3 class ="questions" >Whats your age group?</h3>
                <label class="age-choice">
                <input class = "age-option" type="radio" name="age" value="teenager.html"> 
                Teenager
                </label>
                
                <label class="age-choice">
                <input class = "age-option" type="radio" name="age" value="adult.html">
                Adult
                </label>
                
                <label class="age-choice">
                <input class = "age-option" type="radio" name="age" value="elderly.html"> 
                Elderly
                </label>
            </div>
            <button class="continue">continue</button>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        
        <script>
            // JS

            $(".continue").click(function(){
                let choices = $("input[name='age']:checked").val(); //problem before was that it wasnt checking
                console.log(choices)
                if (choices) {
                    window.location.href = choices;
                } else {
                    alert("Select one of the following age group")
                }
            })
                
                        
            

        </script>
    </body>
</html>
