    <body>
        <!-- HTML -->
        <h3>Whats your age group?</h3>
        <input type="radio" name="age" value="teenager.html"> Teenager<br>
        <input type="radio" name="age" value="adult.html"> Adult<br>
        <input type="radio" name="age" value="elderly.html"> Elderly<br>
        
        <button id="continue">continue</button>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        
        <script>
            // JS

            $("#continue").click(function(){
                let choices = $("input[name='age']:checked").val(); //problem before was that it wasnt checking
                console.log(choices)
                if (choices) {
                    window.location.href = choices;
                } else {
                    alert("Select one of the following age group")
                }
            })
                
                        
            

        </script>
    </body>
