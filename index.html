<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="style.css" rel="stylesheet" type="text/css" />
        <style>
            /* CSS */
        
        </style>

        <title>Title</title>
    </head>
    <body>
        <!-- HTML -->
        <h3>Whats your age group?</h3>
        <input type="radio" name="age" value="teenager.html"> Teenager<br>
        <input type="radio" name="age" value="adult.html"> Adult<br>
        <input type="radio" name="age" value="elderly.html"> Elderly<br>
        
        <button id="continue">continue</button>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="elderly.html"></script>
        <script src="adult.html"></script>
        <script src="teenager.html"></script>
        <!-- <script src="script.js"></script> -->
        <script>
            // JS

            $("#continue").click(function(){
                let s = $("input[name='age']:checked").value(); 
                if (s) {
                    window.location.href = s;
                }
            })
                
                        
            

        </script>
    </body>
</html>
